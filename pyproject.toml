[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maritime-satellite-pipeline"
version = "1.0.0"
description = "Free satellite radar, ships and sea state along the Norwegian coast: ingest, process, catalogue and evaluate."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Reza Azad Gholami" }]
requires-python = ">=3.11,<3.13"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "pyyaml>=6",
  "requests>=2.31",
  "numpy>=1.26,<2.3",
  "scipy>=1.12",
  "pandas>=2.2",
  "pyarrow>=15",
  "shapely>=2.0",
  "pyproj>=3.6",
  "geopandas>=1.0",
  "pyogrio>=0.9",
  "rasterio>=1.3.10",
  "rio-cogeo>=5.3",
  "xarray>=2024.3",
  "netCDF4>=1.7",
  "h5netcdf>=1.3",
  "h5py>=3.10",
  "cfgrib>=0.9.14",
  "eccodes>=2.37",
  "ecmwf-opendata>=0.3.10",
  "pystac>=1.10",
  "pystac-client>=0.8",
  "planetary-computer>=1.0",
  "psycopg[binary]>=3.1",
  "prefect>=3.0,<4",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "joblib>=1.3",
]

[project.optional-dependencies]
ml = ["torch>=2.2"]
demo = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "httpx>=0.27",
  "stac-validator>=3.3",
]

[project.scripts]
msp = "msp.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
msp = ["sql/*.sql", "graphs/*.xml"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["web", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: end-to-end runs on small fixtures",
  "network: needs internet access (skipped in CI)",
]
addopts = "-q -m 'not network'"
