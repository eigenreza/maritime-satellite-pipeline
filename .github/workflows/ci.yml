name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: msp
          POSTGRES_PASSWORD: msp
          POSTGRES_DB: msp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U msp -d msp" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MSP_DB_URL: postgresql://msp:msp@localhost:5432/msp
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,demo,ml]"
      - name: Lint
        run: ruff check src tests server
      - name: Tests (unit, formats, integration on fixtures)
        run: pytest -q
      - name: STAC catalogue validation (offline schemas)
        run: pytest -q tests/test_catalogue.py
      - name: README tables match results/
        run: msp readme-tables --check
      - name: Hygiene and privacy scan
        run: msp scan

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Text and ship tool tests
        working-directory: web
        run: npm test
